# Example: serve the SPA and proxy the API (terminate TLS in front of this or here).
server {
  listen 80;
  root /usr/share/nginx/html;          # contents of apps/web/dist
  client_max_body_size 6m;
  add_header X-Content-Type-Options nosniff;
  add_header Referrer-Policy same-origin;
  location /api/ { proxy_pass http://api:3000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
  location / { try_files $uri /index.html; }
}
